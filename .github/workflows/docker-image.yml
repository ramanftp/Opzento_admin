name: Docker Build Validation

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest


steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Build Backend
    run: docker build -t opzento-backend ./backend

  - name: Build Frontend
    run: docker build -t opzento-frontend ./frontend

  - name: Validate Docker Compose
    run: docker compose config
